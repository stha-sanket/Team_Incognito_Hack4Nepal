{% extends 'uploader/base.html' %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="glass-card rounded-2xl p-6">
        <h2 class="text-2xl font-bold mb-6 flex items-center text-gradient">
            <i class="fas fa-robot mr-3 text-blue-400"></i>
            D-Ask AI Assistant
        </h2>

        <!-- Chat Messages Container -->
        <div id="chatMessages" class="space-y-4 mb-6 h-[500px] overflow-y-auto p-4 glass-card rounded-xl">
            <!-- Welcome Message -->
            <div class="flex items-start space-x-4">
                <div class="w-10 h-10 rounded-full bg-blue-500/20 flex items-center justify-center">
                    <i class="fas fa-robot text-blue-400"></i>
                </div>
                <div class="flex-1">
                    <div class="glass-card p-4 rounded-xl max-w-[80%]">
                        <p class="text-gray-300">Hello! I'm D-Ask AI, your assistant for Nepali citizenship and taxation information. How can I help you today?</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Chat Input Form -->
        <form id="chatForm" class="space-y-4">
            {% csrf_token %}
            <div class="relative">
                <input type="text" 
                       id="messageInput" 
                       class="w-full bg-gray-800/50 text-gray-300 rounded-xl py-3 px-4 pr-12 focus:outline-none focus:ring-2 focus:ring-blue-500 glass-card"
                       placeholder="Type your message here..."
                       autocomplete="off">
                <button type="submit" 
                        class="absolute right-2 top-1/2 transform -translate-y-1/2 bg-gradient-to-r from-blue-500 to-purple-500 text-white p-2 rounded-lg hover:from-blue-600 hover:to-purple-600 transition-all duration-300">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </form>
    </div>
</div>

<style>
@keyframes typing {
    0% { opacity: 0.3; transform: translateY(0); }
    50% { opacity: 1; transform: translateY(-5px); }
    100% { opacity: 0.3; transform: translateY(0); }
}

.typing-dot {
    animation: typing 1s infinite;
}

.typing-dot:nth-child(2) {
    animation-delay: 0.2s;
}

.typing-dot:nth-child(3) {
    animation-delay: 0.4s;
}

@keyframes thinking {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

.thinking-icon {
    animation: thinking 2s linear infinite;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const chatForm = document.getElementById('chatForm');
    const messageInput = document.getElementById('messageInput');
    const chatMessages = document.getElementById('chatMessages');

    function addMessage(message, isUser = false) {
        const messageDiv = document.createElement('div');
        messageDiv.className = 'flex items-start space-x-4 ' + (isUser ? 'justify-end' : '');
        
        const iconDiv = document.createElement('div');
        iconDiv.className = 'w-10 h-10 rounded-full flex items-center justify-center ' + 
                          (isUser ? 'bg-purple-500/20 order-2' : 'bg-blue-500/20');
        iconDiv.innerHTML = `<i class="fas fa-${isUser ? 'user' : 'robot'} ${isUser ? 'text-purple-400' : 'text-blue-400'}"></i>`;
        
        const contentDiv = document.createElement('div');
        contentDiv.className = 'flex-1 ' + (isUser ? 'text-right order-1' : '');
        
        const textDiv = document.createElement('div');
        textDiv.className = `glass-card p-4 rounded-xl ${isUser ? 'ml-auto' : ''} max-w-[80%]`;
        textDiv.innerHTML = `<p class="text-gray-300">${message}</p>`;
        
        contentDiv.appendChild(textDiv);
        messageDiv.appendChild(iconDiv);
        messageDiv.appendChild(contentDiv);
        
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // Add loading indicator
    function showLoadingIndicator() {
        const loadingDiv = document.createElement('div');
        loadingDiv.className = 'flex items-start space-x-4 loading-message';
        loadingDiv.innerHTML = `
            <div class="w-10 h-10 rounded-full bg-blue-500/20 flex items-center justify-center">
                <i class="fas fa-cog text-blue-400 thinking-icon"></i>
            </div>
            <div class="flex-1">
                <div class="glass-card p-4 rounded-xl max-w-[80%]">
                    <div class="flex items-center space-x-2">
                        <span class="text-gray-400">Thinking</span>
                        <div class="flex space-x-1">
                            <div class="w-2 h-2 bg-blue-400 rounded-full typing-dot"></div>
                            <div class="w-2 h-2 bg-blue-400 rounded-full typing-dot"></div>
                            <div class="w-2 h-2 bg-blue-400 rounded-full typing-dot"></div>
                        </div>
                    </div>
                </div>
            </div>
        `;
        chatMessages.appendChild(loadingDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function removeLoadingIndicator() {
        const loadingMessage = chatMessages.querySelector('.loading-message');
        if (loadingMessage) {
            loadingMessage.remove();
        }
    }

    chatForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const message = messageInput.value.trim();
        if (!message) return;
        
        // Add user message
        addMessage(message, true);
        messageInput.value = '';
        
        // Show loading indicator
        showLoadingIndicator();
        
        try {
            const response = await fetch('{% url "chatbot" %}', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
                },
                body: JSON.stringify({ question: message })
            });
            
            const data = await response.json();
            
            // Remove loading indicator
            removeLoadingIndicator();
            
            if (data.success) {
                addMessage(data.answer);
            } else {
                addMessage('Error: ' + (data.message || 'Something went wrong. Please try again.'));
            }
        } catch (error) {
            console.error('Error:', error);
            removeLoadingIndicator();
            addMessage('Network error. Please check your connection and try again.');
        }
    });
});
</script>
{% endblock %}
